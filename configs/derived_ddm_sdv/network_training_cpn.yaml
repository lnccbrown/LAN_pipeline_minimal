# Derived ddm_sdv choice-probability network (CPN) training — laptop, CPU, torch backend.
#
# Not a production_<model>/ pair: there is no data_generation.yaml because
# the corpus is not simulated. It is integrated from the published ddm_sdv
# LAN by LANfactory's `derive-aux` (the derive-aux-networks plan), which
# writes the provenance keys `lan-publish` later requires on the training run.
#
# Same architecture as the LAN it is derived from (see
# production_ddm_sdv/network_training.yaml): one input wider, one log-
# probability out. Fine on a CPU in minutes at this corpus size.
MODEL: "ddm_sdv"
NETWORK_TYPE: "cpn"
# Unused by every consumer (nothing in this repo or LANfactory reads the
# key); kept as "lan" for schema parity with production_ddm_sdv. The
# corpus itself records generator_approach "derived" in its own
# generator_config, which is the authoritative description.
GENERATOR_APPROACH: "lan"

LAYER_SIZES: [[100, 100, 100, 1]]
ACTIVATIONS: [['tanh', 'tanh', 'tanh']]

# Modest: the derived corpus is small and smooth (no simulator noise in the
# labels), and the plateau scheduler below stops learning early anyway.
N_EPOCHS: 10

# 512 MUST divide the rows per file of a derive-aux corpus, which is
# 4096 θ per file -> 8192 rows per file (4096 θ x 2 choices).
# LANfactory's DatasetTorch hard-fails at load ("samples_per_file must be
# divisible by batch_size") on any remainder, so a change here has to keep
# 4096 % batch == 0 (and 8192 % batch == 0 for a cpn).
CPU_BATCH_SIZE: 512         # equal to GPU so a GPU run is the same
GPU_BATCH_SIZE: 512         # optimisation problem, not a 16x larger one

OPTIMIZER_: "adam"
LEARNING_RATE: 0.001
WEIGHT_DECAY: 0.0
LR_SCHEDULER: 'reduce_on_plateau'
LR_SCHEDULER_PARAMS:
  factor: 0.1
  patience: 2
  threshold: 0.001
  min_lr: 0.00000001
  verbose: True

# Splits across FILES: with derive-aux's default 100 files that is 98 train
# / 2 validation.
TRAIN_VAL_SPLIT: 0.98

# A SENTINEL, applied as min(files_found, this). It does NOT assert that
# 10000 files exist.
N_TRAINING_FILES: 10000

# Must stay a quoted string: it is eval'd with numpy in scope, and a bare
# -16.1 raises TypeError.
LABELS_LOWER_BOUND: "np.log(1e-7)"

# False deliberately: DatasetTorch advances files on batch index, so a
# shuffled index stream reads rows from whichever file happens to be loaded.
SHUFFLE: False

# PLACEHOLDER. Point at the folder `derive-aux --network-type cpn` wrote for
# the ddm_sdv LAN, e.g. data/derived/cpn/ddm_sdv. Overridden by
# --training-data-folder; it is a local path, so it is not committed.
TRAINING_DATA_FOLDER: ""
