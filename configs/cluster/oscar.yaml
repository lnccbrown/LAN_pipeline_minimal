# Oscar (Brown CCV) cluster resource inventory.
#
# PURPOSE
#   The record of *what we can schedule where*: which condos we hold, their
#   partitions and limits, and which job kinds they suit. sbatch_scripts/
#   gen_sbatch.py reads the job_defaults section via --cluster-config, so
#   submissions are made with full awareness of what's around instead of
#   hardcoded guesses. Explicit CLI flags always override these defaults.
#
# PROVENANCE
#   Seeded from the cluster: `sacctmgr show associations user=$USER`,
#   `sacctmgr show qos`, `sinfo`, `scontrol show partition`.
#   Everything here is a property of the cluster and of the lab's condo
#   allocation, so it is the same for every member and belongs in the repo.
#   Anything user-specific — storage paths, quotas, tokens — does NOT live
#   here; pass it per invocation (--output-path, MLFLOW_TRACKING_URI).
#   See configs/README.md for the storage convention.
#   Refresh after any condo change. Do not edit limits from memory.
#
# SCHEMA
#   condos:            per-condo record (account name -> details)
#     partitions:      partition names usable under this account
#     nodes:           node classes available, with cores/mem/gpus
#     limits:          per-user caps (these come from the QOS, not the
#                      partition — partition MaxTime reads UNLIMITED)
#     suited_for:      job kinds that belong here
#     verified_on:     date this entry was last read off the cluster
#   job_defaults:      job kind -> sbatch defaults (account, partition,
#                      cores, mem, num_gpus, time)
#   modules:           modules loaded at the top of every generated script

condos:
  carney-mjfrank-condo2:
    partitions: [batch, gpu-he]
    qos: {batch: carney-condo2, gpu-he: carney-gcondo2}
    nodes:
      batch: {node_count: 291, cores: "32+", mem: "190G+", gpus: null}
      gpu-he:
        - {node_count: 17, cores: 128, mem: "772G+", gpus: {type: rtx_pro_6000_blackwell_max-q, count: 8}}
        - {node_count: 14, cores: 128, mem: "1540G", gpus: {type: l40s, count: 8}}
        - {node_count: 8, cores: 112, mem: "2062G", gpus: {type: b200, count: 8}}
        - {node_count: 2, cores: 112, mem: "2056G", gpus: {type: h100, count: 8}}
        - {node_count: 1, cores: 64, mem: "1028G", gpus: {type: rtx_a6000, count: 8}}
    limits:
      # Per-user caps from the QOS. No MaxWall is set on either, so wall time
      # is effectively uncapped — but ask for what you need, not the maximum.
      batch: {max_cores: 208, max_mem: 2500G, max_walltime: null}
      gpu-he: {max_cores: 160, max_gpus: 75, max_mem: 1920G, max_submit_jobs: 1200}
    suited_for: [generate, jaxtrain, torchtrain]
    verified_on: 2026-08-09

  # The default (non-condo) account, for smoke tests when the condo is busy.
  # Lower priority; partitions batch/debug/gpu/gpu-debug/vnc.
  default:
    partitions: [batch, debug, gpu, gpu-debug]
    qos: {batch: normal, debug: debug, gpu: norm-gpu, gpu-debug: gpu-debug}
    nodes: {}
    limits: {}
    suited_for: []
    verified_on: 2026-08-09

job_defaults:
  # Datagen: CPU-bound array jobs, many small workers. The 208-core cap is
  # per user across the QOS, so an array of ~200 single-core tasks saturates
  # it; size n_jobs_in_array with that in mind.
  generate:
    account: carney-mjfrank-condo2
    partition: batch
    cores: 1
    mem: 16G
    num_gpus: 0
    time: "04:00:00"
  # Training: one GPU is plenty for these MLPs. gpu-he nodes carry 8 GPUs
  # each, so a 1-GPU request packs well and schedules faster than a whole node.
  jaxtrain:
    account: carney-mjfrank-condo2
    partition: gpu-he
    cores: 8
    mem: 64G
    num_gpus: 1
    time: "12:00:00"
  torchtrain:
    account: carney-mjfrank-condo2
    partition: gpu-he
    cores: 8
    mem: 64G
    num_gpus: 1
    time: "12:00:00"
  # Recovery fits: single-core CPU array jobs. numpyro runs chains
  # sequentially on one JAX device, so cores > 1 buys nothing — parallelism
  # comes from the array (one fit per task) on the batch partition, which
  # does not queue behind the lab-wide GPU QOS.
  recover:
    account: carney-mjfrank-condo2
    partition: batch
    cores: 1
    mem: 8G
    num_gpus: 0
    time: "04:00:00"

modules:
  - python
  - gcc
