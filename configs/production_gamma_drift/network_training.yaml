# gamma_drift production LAN training.
#
# Two candidate architectures, trained on the same data as separate jobs:
#   --network-id 0: [100, 100, 100] — the legacy convention for 5–6 param
#                   models (ddm_sdv, angle, levy, ornstein all shipped this).
#   --network-id 1: [150, 150, 150] — the legacy convention above ~6 params
#                   (race_no_bias_angle_4, 8 params, shipped this).
# gamma_drift has 7 params (input dim 9 = 7 + rt + choice, inferred from
# data at runtime); validation + recovery decide which candidate ships.
#
# GPU_BATCH_SIZE must divide rows-per-file (N_PARAMETER_SETS x
# N_SAMPLES_PER_PARAM = 10^7) exactly: 50000 -> 200 batches/file.

NETWORK_TYPE: "lan"
CPU_BATCH_SIZE: 1000
GPU_BATCH_SIZE: 50000
GENERATOR_APPROACH: "lan"
OPTIMIZER_: "adam"
N_EPOCHS: 20
TRAINING_DATA_FOLDER: "data/training_data/lan/training_data_n_samples_200000_dt_0.001/gamma_drift"
MODEL: "gamma_drift"
SHUFFLE: True
LAYER_SIZES: [[100, 100, 100, 1], [150, 150, 150, 1]]
ACTIVATIONS: [['tanh', 'tanh', 'tanh'], ['tanh', 'tanh', 'tanh']]
WEIGHT_DECAY: 0.0
TRAIN_VAL_SPLIT: 0.98
N_TRAINING_FILES: 300
LABELS_LOWER_BOUND: np.log(1e-7)
LEARNING_RATE: 0.001
LR_SCHEDULER: 'reduce_on_plateau'
LR_SCHEDULER_PARAMS:
  factor: 0.1
  patience: 2
  threshold: 0.001
  min_lr: 0.00000001
  verbose: True
