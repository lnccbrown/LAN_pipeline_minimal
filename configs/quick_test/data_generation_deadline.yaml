# Quick Test Data Generation Configuration - Deadline variant
# Minimal settings for fast local testing (~10-30 seconds)

MODEL: 'ddm_deadline'
GENERATOR_APPROACH: 'lan'

PIPELINE:
  N_PARAMETER_SETS: 10
  N_SUBRUNS: 2

SIMULATOR:
  N_SAMPLES: 1000
  DELTA_T: 0.001

TRAINING:
  N_SAMPLES_PER_PARAM: 100

ESTIMATOR:
  TYPE: 'kde'
