# Quick Test OPN Training Configuration
# Minimal settings for fast local testing (~30-60 seconds)

NETWORK_TYPE: "opn"
CPU_BATCH_SIZE: 10
GPU_BATCH_SIZE: 10
GENERATOR_APPROACH: "lan"
OPTIMIZER_: "adam"
N_EPOCHS: 2
MODEL: "ddm_deadline"
TRAINING_DATA_FOLDER: ""  # Will be overridden by CLI --training-data-folder
SHUFFLE: True

# Single small network architecture for quick testing
LAYER_SIZES: [[50, 50, 1]]
ACTIVATIONS: [['tanh', 'tanh']]

WEIGHT_DECAY: 0.0
TRAIN_VAL_SPLIT: 0.8
N_TRAINING_FILES: 100
LABELS_LOWER_BOUND: "np.log(1e-7)"
LEARNING_RATE: 0.001
LR_SCHEDULER: 'reduce_on_plateau'
LR_SCHEDULER_PARAMS:
  factor: 0.1
  patience: 2
  threshold: 0.001
  min_lr: 0.00000001
  verbose: True
