[project]
name = "lan-pipeline-minimal"
version = "0.1.0"
description = "Environment to create and submit sbatch scripts to generate data with ssm-simulators or train LANs with LANfactory on Oscar"
readme = "README.md"
# Floor 3.12: lanfactory 0.8+ and ssm-simulators 0.13+ both require >=3.12,
# so 3.11 was already unsatisfiable in practice.
requires-python = ">=3.12, <3.13"
dependencies = [
    # Floors match the features this pipeline drives: lanfactory 0.8+ ships the
    # hf/ upload module and (post-0.8.0 main) MLflow run identity + jax->ONNX
    # export; ssm-simulators 0.13.2+ ships datagen run identity. Both resolve
    # from git main below, so the lockfile pins exact commits.
    "lanfactory>=0.8",
    "ssm-simulators>=0.13.2",
    "mlflow>=3.6.0",
    # Declared so the CUDA-build pin in [tool.uv.sources] binds to it — uv
    # sources only apply to *direct* dependencies. lanfactory pulls torch in
    # regardless; this only controls which wheel is chosen.
    "torch>=2.4",
]

# torch arrives via lanfactory, and PyPI's default wheel now targets CUDA 13.
# Oscar's GPU nodes run driver 575.57.08, which tops out at CUDA 12.9, so that
# wheel cannot initialise CUDA — and torch does not fail, it falls back to CPU.
# The job then holds a GPU allocation at 0% utilisation and trains on the host,
# which for a production LAN is the difference between hours and a week.
#
# cu128 is the portable choice, not the narrow one: CUDA minor-version
# compatibility means a cu12x build runs on any driver >= its minimum,
# including newer ones. Defaulting to the newest build is what breaks.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lanfactory = { git = "https://github.com/lnccbrown/lanfactory", branch = "main" }
ssm-simulators = { git = "https://github.com/lnccbrown/ssm-simulators", branch = "main" }
# Linux only: there are no macOS CUDA wheels, so an unconditional pin would
# make the lock unresolvable on a laptop. Sources apply to *declared*
# dependencies, which is why torch is listed above even though lanfactory
# already pulls it.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[dependency-groups]
# The gate loads a candidate network through HSSM itself — this is the one repo
# allowed to depend on both ends of the ecosystem. Kept out of the default deps
# so submitting jobs does not drag in the inference stack.
validate = [
    "hssm>=0.4.0",
    "onnxruntime>=1.17",
    # A *stable* numba: with numpy 2.5 the resolver otherwise picks 0.63.0b1,
    # whose np.row_stack reference (removed in numpy 2.0) breaks the pytensor
    # import and therefore every HSSM model. numba 0.66 caps numpy<2.5, which
    # is what actually pulls the pair back into a working combination.
    "numba>=0.66",
]
# Eyeballing a candidate network (validation/inspect_network.py). Separate from
# `validate`: the gate must run headless on any machine, this only runs where a
# human is looking. lanfactory already carries matplotlib/plotly/seaborn.
inspect = [
    "marimo>=0.11",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.3.1",
    # <0.16: ruff 0.16 flags pre-existing code repo-wide (B008 on the standard
    # typer.Option idiom, ...). Same pin as ssm-simulators and LANfactory;
    # migrate the ecosystem to 0.16 deliberately, in one dedicated pass.
    "ruff>=0.15.1,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselected by default: needs the validate group and downloads from HuggingFace.
addopts = "-m 'not production'"
markers = [
    "production: runs against the real franklab/HSSM artifacts (network + hssm)",
]
